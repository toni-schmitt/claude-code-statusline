name: CI

# Build and test on every push and pull request, and additionally prove the
# Native AOT publish still works. AOT-breaking changes (reflection, dynamic
# codegen, an unannotated trim root) only surface at publish time, never at
# `dotnet build` or `dotnet test` — so without this, the first sign of breakage
# would be a failed release.
#
# Third-party actions are pinned to commit SHAs; the version is in the comment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job needs the token afterwards; not
          # persisting it keeps it out of .git/config.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build Ember.slnx -c Release

      - name: Test
        run: dotnet test tests/Ember.Tests/Ember.Tests.csproj -c Release --no-build

  aot:
    name: AOT publish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job needs the token afterwards; not
          # persisting it keeps it out of .git/config.
          persist-credentials: false

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish for the host platform
        # The point of this job is the IL trim/AOT analyzer warnings, which
        # appear only at publish time and are how a binary that publishes
        # cleanly still crashes at runtime.
        #
        # -warnaserror is deliberately unscoped rather than a list of IL codes:
        # the trim/AOT code range is far too large to enumerate accurately, and
        # missing one ships a broken binary while an unrelated new warning just
        # breaks CI loudly and is trivial to fix. Note the cost of that choice —
        # dotnet-version floats on 10.0.x, so an SDK update that adds any new
        # warning will fail this job.
        run: |
          dotnet publish src/Ember/Ember.csproj -c Release -p:PublishAot=true -o dist -warnaserror
          dotnet publish src/Ember.Subagent/Ember.Subagent.csproj -c Release -p:PublishAot=true -o dist -warnaserror

      - name: Smoke test
        run: ./scripts/smoke-test.sh dist

      - name: Cross-compile check (osx-x64)
        # The release builds osx-x64 on an arm64 runner and lipos the two
        # together. Without this step that cross-compile is exercised only at
        # tag time, so a regression in it would surface as a failed release
        # rather than a failed CI run. The binary is only inspected, not run:
        # an arm64 runner cannot be relied on to have Rosetta.
        if: runner.os == 'macOS'
        run: |
          dotnet publish src/Ember/Ember.csproj -c Release -r osx-x64 -p:PublishAot=true -o dist-x64 -warnaserror
          dotnet publish src/Ember.Subagent/Ember.Subagent.csproj -c Release -r osx-x64 -p:PublishAot=true -o dist-x64 -warnaserror
          file dist-x64/ember dist-x64/ember-subagent
          file dist-x64/ember | grep -q 'x86_64' || { echo "osx-x64 publish did not produce an x86_64 binary" >&2; exit 1; }
          file dist-x64/ember-subagent | grep -q 'x86_64' || { echo "osx-x64 subagent is not x86_64" >&2; exit 1; }
