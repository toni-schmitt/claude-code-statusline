name: CI

# Build and test on every push and pull request, and additionally prove the
# Native AOT publish still works. AOT-breaking changes (reflection, dynamic
# codegen, an unannotated trim root) only surface at publish time, never at
# `dotnet build` or `dotnet test` — so without this, the first sign of breakage
# would be a failed release.
#
# Third-party actions are pinned to commit SHAs; the version is in the comment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build Ember.slnx -c Release

      - name: Test
        run: dotnet test tests/Ember.Tests/Ember.Tests.csproj -c Release --no-build

  aot:
    name: AOT publish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish for the host platform
        # -warnaserror turns an IL trim/AOT analyzer warning into a build
        # failure. Those warnings are how a binary that publishes cleanly still
        # crashes at runtime; they must not accumulate silently.
        run: |
          dotnet publish src/Ember/Ember.csproj -c Release -p:PublishAot=true -o dist -warnaserror
          dotnet publish src/Ember.Subagent/Ember.Subagent.csproj -c Release -p:PublishAot=true -o dist -warnaserror

      - name: Smoke test
        run: ./scripts/smoke-test.sh dist
